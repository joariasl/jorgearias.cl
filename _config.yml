# NB! Tread carefully if you want to change the variables below this point!

# Sections shown in the index page
pages_list:
  Acerca de: 'about'
  Twitter Timeline: 'twitter-timeline'
  Blog: 'latest-post'
  Carrera: 'timeline'
  Contacto: 'contact'
# Exclusion list from the generated _site
exclude:
  - LICENSE
  - README.md
  - CONTRIBUTING
  - CONTRIBUTORS
  - scripts
  - Dockerfile
  - docker-compose.yml
# Pagination path
paginate_path: "blog/page:num/"
# Enable minification SASS
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-spaceship
